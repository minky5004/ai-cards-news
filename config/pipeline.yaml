# 파이프라인 튜닝 값. 코드를 고치지 않고 여기서만 조정한다.

ingest:
  # 이 시간 안에 나온 것만 후보로 본다. 하루 한 번 도는데 36시간을 보는 이유는
  # 실행 직전에 뜬 기사와 전날 저녁 기사를 같이 잡기 위해서다.
  lookbackHours: 36

relevance:
  # 제목·URL 에 이 중 하나라도 걸리면 AI 소재로 본다. 하나도 없으면 버린다.
  # (sources.yaml 에서 aiOnly: true 인 피드는 이 검사를 건너뛴다.)
  #
  # 앞쪽에만 단어 경계를 적용한다 — "GPT5.6", "LLMs", "fine-tuning" 을 잡기 위해서다.
  # 따라서 다른 단어의 앞부분이 되는 짧은 조각은 넣지 마라. ("ai" 를 넣으면 airport 가 통과한다.)
  terms:
    # 모델·기업 고유명사
    - openai
    - anthropic
    - claude
    - deepmind
    - gemini
    - chatgpt
    - gpt
    - llama
    - mistral
    - deepseek
    - qwen
    - kimi
    - grok
    - copilot
    - midjourney
    - sora
    - fable
    - hugging face
    - huggingface
    # 기술 용어
    - llm
    - machine learning
    - deep learning
    - neural net
    - transformer
    - diffusion model
    - foundation model
    - language model
    - frontier model
    - open model
    - open-weight
    - open weight
    - fine-tun
    - lora
    - inference
    - multimodal
    - generative
    - superintelligence
    - hallucinat
    - chatbot
    - agentic
    - robot

  # 대문자 약어. 양쪽 단어 경계 + 대소문자 구분으로 엄격하게 본다.
  # "AI" 를 느슨하게 잡으면 Airport·Airbus·AirPods 가 전부 통과한다.
  acronyms:
    - AI
    - AGI
    - ML
    - RAG
    - GPU

dedup:
  # 같은 사건 판정. 2026-07-22 수집분(54건)에 정답을 붙여 격자 탐색한 값이다.
  # 이 조합에서 정답 사건 6개가 전부 온전히 묶였고, 큰 클러스터 2개에 무관 기사가
  # 하나씩 딸려왔다. 딸려온 기사는 대표로 뽑히지 않으므로(신뢰도 순) 카드 내용에는
  # 영향이 없고, mentions 가 1 부풀려지는 정도다.
  #
  # 더 조이면(자카드 0.3) 오염은 0 이 되지만 OpenAI·Hugging Face 보도 3건이
  # 아예 안 묶여 화제성 신호를 통째로 잃는다. 그쪽이 더 손해라 오염을 감수했다.

  # 공유해야 하는 최소 내용어 수. 아래 두 비율의 하한선 역할을 한다.
  # 1 로 내리면 "Advertise in ChatGPT" 와 "ChatGPT for small business" 가 뭉친다.
  minSharedTokens: 2

  # 짧은 쪽 제목이 상대에 포함되는 비율. 길이 차이에 벌점이 없어 짧은 제목을 잡는다.
  # ("Gemini 3.6 Flash" 는 자카드로는 어떤 기사와도 닿지 못한다.)
  titleOverlap: 0.5

  # 토큰 자카드. 제목이 둘 다 길 때 쓰인다.
  # 0.22 로 올리면 OpenAI·Hugging Face 3건이 흩어지고, 0.15 로 내리면 무관 기사가 뭉친다.
  titleSimilarity: 0.2

extract:
  # 선정분이 스크래핑에 막히면 그 아래 순위 클러스터로 내려가 자리를 채운다. 이 값은 그때
  # 몇 개 클러스터까지 시도할 것인가의 상한이다. 임계값(scoring.minScore) 아래로는 내려가지
  # 않으므로, 조용한 날에는 후보가 먼저 떨어져 이 값에 닿지도 않는다.
  #
  # 백필 몫이 아니라 선정분 시도까지 포함한 총량이다. scoring.maxCards 보다 작게 두면 선정분이
  # 전부 성공하는 날에도 그 수에서 멈추므로, 로딩 시점에 두 값을 견줘 막는다.
  #
  # 발행분 34일 실측에서 클러스터 추출 성공률이 86%(167건 중 144건)였다. 10회면 5장을 채우기에
  # 충분하고, 상한이 없으면 임계값 통과분(하루 평균 17.6개)을 전부 긁는다.
  maxAttempts: 10

copy:
  # 카피라이팅에 쓰는 모델. 기사 하나당 한 번 호출한다.
  # Gemini 무료 티어를 쓴다 — 하루 5회 호출이라 한도에 여유롭게 들어간다.
  model: gemini-3.6-flash

  # 출력 상한. 카피 자체는 짧지만 사고 토큰이 포함될 수 있어 여유를 둔다.
  maxTokens: 4000

  # 사고 토큰 예산. 비워 두면 모델 기본값, 0 이면 사고를 끈다.
  # 카피가 밋밋하면 늘리고, 응답이 느리거나 한도가 아까우면 0 으로 내린다.
  thinkingBudget:

idea:
  # 오늘 기사에서 사업 아이디어 1건을 뽑는다. 하루 한 번, 한 번만 호출한다.
  # 카피 5회와 합쳐 6회라 하루 20회 한도에 여유가 크다.
  model: gemini-3.6-flash

  # 출력 상한. 카피와 달리 섹션이 열 개 넘게 나오므로 크게 잡는다.
  # 여기서 잘리면 JSON 이 닫히지 않아 응답 전체를 못 쓴다.
  maxTokens: 16000

  thinkingBudget:

  # 재료로 넣을 후보 상한. 카드가 된 5건 아래의 대기 후보까지 넣어 재료를 넓힌다 —
  # 선정분만 주면 아이디어가 그날의 큰 뉴스 하나에 끌려간다.
  # 임계값(scoring.minScore) 통과분이 하루 평균 17.6개라 이 값이 실제 상한이 된다.
  maxCandidates: 15

  # 후보 하나당 본문에서 잘라 넣을 글자 수. 본문 길이가 1106~11278자로 열 배 넘게
  # 벌어져서, 자르지 않으면 긴 기사 하나가 프롬프트를 독차지한다.
  bodyExcerpt: 1500

  # 중복 판정에 쓸 HN 검색 결과 상한. 근거로 카드·JSON 에 싣는 건수이기도 하다.
  verifyHits: 5

  # 유사 사례의 최고 점수가 이 값 이상이면 CROWDED 로 본다.
  # HN 300점은 프론트페이지 상단까지 간 글이라, 그 주제가 이미 널리 다뤄졌다는 뜻이다.
  crowdedPoints: 300

scoring:
  # 모든 항목을 0~1 로 정규화한 뒤 이 가중치를 곱한다.
  # 따라서 가중치가 그대로 항목 간 상대 중요도이고, 만점은 가중치 총합(8.5)이다.
  weights:
    hnPoints: 2.0
    hnComments: 1.0
    # 여러 매체가 같은 사건을 보도했다는 신호. 화제성의 가장 직접적인 증거라 높게 둔다.
    mentions: 2.5
    recency: 1.5
    sourceTrust: 1.5

  # 정규화 기준값. 이 값에 도달하면 해당 항목이 만점이 된다.
  references:
    points: 500
    comments: 200
    # 세 곳 이상이 다뤘으면 충분히 화제다.
    mentions: 3

  # 최신성 감쇠 반감기. 18시간 지나면 최신성 기여가 절반이 된다.
  recencyHalfLifeHours: 18

  # 이 점수에 못 미치면 카드로 만들지 않는다.
  # 조용한 날 억지로 5장을 채우는 것보다 3장만 내는 게 낫다.
  minScore: 2.5

  # 하루 최대 카드 수
  maxCards: 5
