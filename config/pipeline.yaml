# 파이프라인 튜닝 값. 코드를 고치지 않고 여기서만 조정한다.

ingest:
  # 이 시간 안에 나온 것만 후보로 본다. 하루 한 번 도는데 36시간을 보는 이유는
  # 실행 직전에 뜬 기사와 전날 저녁 기사를 같이 잡기 위해서다.
  lookbackHours: 36

dedup:
  # 제목 토큰 자카드 유사도가 이 값 이상이면 같은 사건으로 묶는다.
  # 높이면 클러스터가 잘게 쪼개지고, 낮추면 다른 사건이 뭉친다.
  titleSimilarity: 0.38

scoring:
  # 모든 항목을 0~1 로 정규화한 뒤 이 가중치를 곱한다.
  # 따라서 가중치가 그대로 항목 간 상대 중요도이고, 만점은 가중치 총합(8.5)이다.
  weights:
    hnPoints: 2.0
    hnComments: 1.0
    # 여러 매체가 같은 사건을 보도했다는 신호. 화제성의 가장 직접적인 증거라 높게 둔다.
    mentions: 2.5
    recency: 1.5
    sourceTrust: 1.5

  # 정규화 기준값. 이 값에 도달하면 해당 항목이 만점이 된다.
  references:
    points: 500
    comments: 200
    # 세 곳 이상이 다뤘으면 충분히 화제다.
    mentions: 3

  # 최신성 감쇠 반감기. 18시간 지나면 최신성 기여가 절반이 된다.
  recencyHalfLifeHours: 18

  # 이 점수에 못 미치면 카드로 만들지 않는다.
  # 조용한 날 억지로 5장을 채우는 것보다 3장만 내는 게 낫다.
  minScore: 2.5

  # 하루 최대 카드 수
  maxCards: 5
