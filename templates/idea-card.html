<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /*
        폰트는 base64 로 심어 넣는다. Actions 러너에 한글 폰트가 없고, file:// 참조는
        헤드리스 브라우저의 로컬 파일 정책에 걸린다. 뉴스 카드와 같은 사정이다.
      */
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 400;
        src: url({{fontRegular}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 700;
        src: url({{fontBold}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 900;
        src: url({{fontBlack}}) format("woff2");
      }

      :root {
        /*
          종이 핑크와 강조 자주. 빨강 #d9402f 은 이 핑크 위에서 대비 2.93 으로 하한 미달이고
          자주는 4.49 다 — 뉴스 카드가 노란 종이 위에서 빨강을 쓰는 것과 결론이 갈리는 자리다.
        */
        --paper: #fbc3d4;
        --mark: #b0184e;
        --ink: #34161f;
        --ink-soft: #8d5567;
        --body-ink: #552c39;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1350px;
        position: relative;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 종이 섬유. 균일한 색면은 종이로 읽히지 않는다 — 뉴스 카드와 같은 처방이라 두 장이 같은 리포의 것으로 읽힌다. */
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.16'/></svg>");
      }

      /*
        패딩 위아래에 머리와 결재란의 자리가 들어 있다. 둘 다 흐름에서 빠져 고정돼 있으므로
        여기 남는 공간이 곧 글이 놓일 수 있는 높이다 — 넘침을 이 한 값으로 잰다. 뉴스 카드와
        같은 구조여야 CardRenderer 의 넘침 계산이 두 템플릿에 그대로 선다.
      */
      .sheet {
        position: absolute;
        inset: 0;
        padding: 184px 84px 158px;
      }

      /* 머리. 상단 이중 괘선이 이 카드를 서류로 만든다 — 뉴스 카드의 접착 띠에 대응하는 자리다. */
      header {
        position: absolute;
        top: 96px;
        left: 84px;
        right: 84px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 18px;
        border-bottom: 3px solid var(--mark);
        box-shadow: 0 6px 0 -3px var(--mark);
      }

      .kind {
        font-size: 29px;
        font-weight: 900;
        letter-spacing: 0.22em;
        color: var(--mark);
      }

      .date {
        font-size: 26px;
        font-weight: 700;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      /* 글은 위에서부터 쌓는다. 넘침을 잴 수 있는 유일한 방향이다. */
      .stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      /*
        제품명 칩.

        조어를 브랜드 표식의 지위로 내린다. 한때 이 자리가 116px 짜리 주인공이었는데, 덱에
        놓고 축소해 보니 읽히는 것이 <b>LLM 이 지어낸 모르는 영어 단어 하나</b>뿐이었다 —
        뉴스 카드는 같은 크기에서 "해킹 성능 2배" 가 그대로 읽힌다. 정보가 0 인 낱말에 축소를
        견뎌야 하는 가장 큰 자리를 줄 이유가 없다. 칩으로 내리면 글자가 뭉개도 색 덩어리는
        남아 위치 표식 노릇을 한다.
      */
      .name {
        flex: none;
        padding: 10px 24px 12px;
        background: var(--mark);
        color: var(--paper);
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -0.01em;
        border-radius: 8px;
      }

      /* 주인공. 축소해도 이 한 덩어리는 읽혀야 한다. */
      .tagline {
        margin-top: 26px;
        font-size: 72px;
        font-weight: 900;
        line-height: 1.22;
        letter-spacing: -0.035em;
        /* 줄바꿈이 조사에서 끊기면 읽는 리듬이 무너진다. */
        word-break: keep-all;
        text-wrap: balance;
      }

      .problem {
        margin-top: 36px;
        padding-top: 32px;
        border-top: 2px dashed rgba(176, 24, 78, 0.4);
        align-self: stretch;
        font-size: 33px;
        font-weight: 400;
        line-height: 1.58;
        color: var(--body-ink);
        word-break: keep-all;
      }

      /*
        핵심 기능. 서류의 항목에는 번호가 붙는다 — 번호가 자주색이라 시선이 한 번 더 걸리고,
        아래쪽이 "안 쓴 자리" 가 아니라 "적어 넣은 항목" 이 된다.
      */
      .features {
        margin-top: 44px;
        align-self: stretch;
      }

      .features h2 {
        font-size: 25px;
        font-weight: 900;
        letter-spacing: 0.2em;
        color: var(--mark);
        margin-bottom: 20px;
      }

      .features li {
        display: flex;
        gap: 22px;
        align-items: baseline;
        padding: 14px 0;
        border-top: 2px solid rgba(176, 24, 78, 0.22);
        font-size: 31px;
        line-height: 1.4;
        color: var(--ink);
        word-break: keep-all;
        list-style: none;
      }

      .features li b {
        flex: none;
        width: 44px;
        font-size: 25px;
        font-weight: 900;
        color: var(--mark);
        font-variant-numeric: tabular-nums;
      }

      /*
        결재란. 뉴스 카드의 메타와 같은 자리이고, 글줄 수와 무관하게 고정돼야 두 장이 한 묶음으로
        읽힌다.
      */
      footer {
        position: absolute;
        left: 84px;
        right: 84px;
        bottom: 96px;
        padding-top: 26px;
        border-top: 2px solid rgba(176, 24, 78, 0.28);
        font-size: 25px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      /*
        도장. 자주는 원래 고무도장 잉크색이라 판정이 여기서 제 자리를 얻는다.

        결재란에 두는 것은 타협이 아니다. 제품명 옆·항목 위에 차례로 놓아 봤는데 태그라인과
        항목을 각각 덮었다 — 태그라인도 본문도 전폭이라 <b>오른쪽에 빈 열이 없다</b>. 그리고
        서류의 도장은 원래 마지막 결재란에 찍힌다. 결재란 선을 걸치게 둬 "여백에 놓인 것" 이
        아니라 "다 적고 찍은 것" 으로 읽히게 한다.
      */
      .stamp {
        position: absolute;
        right: 84px;
        bottom: 78px;
        padding: 14px 26px 16px;
        border: 5px solid var(--mark);
        border-radius: 10px;
        color: var(--mark);
        text-align: center;
        transform: rotate(-8deg);
        opacity: 0.9;
        background: rgba(251, 195, 212, 0.55);
      }

      .stamp span {
        display: block;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 0.06em;
      }

      .stamp small {
        display: block;
        margin-top: 2px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.14em;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>

    <div class="sheet">
      <header>
        <span class="kind">오늘의 아이디어</span>
        <span class="date">{{date}}</span>
      </header>

      <div class="stack">
        <span class="name">{{productName}}</span>
        <h1 class="tagline">{{tagline}}</h1>
        <p class="problem">{{problem}}</p>

        <div class="features">
          <h2>핵심 기능</h2>
          <ul>
            {{features}}
          </ul>
        </div>
      </div>

      <footer>{{sourceNote}}</footer>
    </div>

    <div class="stamp"><span>{{verdict}}</span><small>{{verdictNote}}</small></div>
  </body>
</html>
