<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /*
        폰트는 base64 로 심어 넣는다. Actions 러너에 한글 폰트가 없고, file:// 참조는
        헤드리스 브라우저의 로컬 파일 정책에 걸린다. 심어 두면 네트워크도 정책도 타지 않는다.
      */
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 400;
        src: url({{fontRegular}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 700;
        src: url({{fontBold}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 900;
        src: url({{fontBlack}}) format("woff2");
      }

      :root {
        /* 사이트의 --text 와 같은 값. 카드와 웹이 같은 잉크를 쓴다. */
        --ink: #16181d;
        --cream: #f4f1e8;
        --navy: #23407e;
        --amber: #ffc94d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1350px;
        position: relative;
        overflow: hidden;
        background: var(--ink);
        color: var(--cream);
        font-family: "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 이미지는 카드를 통째로 덮는다. 텍스트는 그 위에 앉는다. */
      .photo {
        position: absolute;
        inset: 0;
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        /*
          원문 대표 이미지는 우리가 고를 수 없다 — 사진인 날도 있고 남의 글자가 가득한
          og:image 인 날도 있다(GitHub 레포 카드가 그렇다). 세로 규격에 맞춰 크롭되면
          그 글자가 확대돼 카드의 주인공을 뺏는다. 채도와 밝기를 눌러 배경 질감으로
          내려놓으면 어떤 이미지가 와도 헤드라인이 카드를 지배한다.
        */
        filter: brightness(0.74) saturate(0.82) contrast(0.94);
      }

      /*
        스크림. 헤드라인이 어떤 사진 위에서도 읽혀야 하므로 아래쪽을 강하게 누른다.
        가운데(26~52%)는 거의 건드리지 않아 사진의 주제가 살아 있고, 상단은 흰 배경
        썸네일이 눈부신 사각형으로 뜨는 것만 살짝 잡는다.
      */
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(22, 24, 29, 0.58) 0%,
          rgba(22, 24, 29, 0.22) 30%,
          rgba(22, 24, 29, 0.46) 56%,
          rgba(22, 24, 29, 0.9) 78%,
          rgba(22, 24, 29, 0.99) 100%
        );
      }

      /*
        원문 대표 이미지가 없거나 받지 못했을 때. 빈 자리를 메우는 게 아니라 타이포
        포스터라는 다른 종류의 카드가 된다 — .stack 규칙이 헤드라인을 키운다.
      */
      .no-image .photo {
        background: linear-gradient(150deg, var(--navy) 0%, var(--ink) 78%);
      }

      .no-image .scrim {
        background: none;
      }

      .content {
        position: absolute;
        inset: 0;
        padding: 96px 64px 60px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      h1 {
        font-size: 96px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.03em;
        /* 줄바꿈이 조사에서 끊기면 읽는 리듬이 무너진다. */
        word-break: keep-all;
        text-wrap: balance;
        /* 밝은 사진 위에서 스크림만으로 모자랄 때의 마지막 안전장치. */
        text-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
      }

      .no-image h1 {
        font-size: 128px;
        text-shadow: none;
      }

      /*
        강조는 글자색만 바꾼다. 형광펜처럼 반투명 획을 뒤에 깔아 봤는데, 딥 네이비 위의
        반투명 앰버가 탁한 올리브 띠로 앉아 강조가 아니라 얼룩으로 읽혔다. 배경을 채운
        사각형도 안 된다 — 줄 사이가 벌어져 헤드라인 덩어리가 깨진다.
      */
      mark {
        background: none;
        color: var(--amber);
      }

      .meta {
        margin-top: 44px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 32px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: rgba(244, 241, 232, 0.72);
      }

      /*
        출처명은 길이를 예측할 수 없다 — "AGN" 인 날도 있고 "Stanford Institute for
        Economic Policy Research (SIEPR)" 인 날도 있다. 줄어드는 것은 출처명 하나뿐이고
        날짜와 페이지 번호는 통째로 남는다. 한 덩어리로 두면 긴 출처명이 날짜부터 잘라먹는다.
      */
      .origin {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      .source {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .date,
      .page {
        flex: none;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="{{variant}}">
    <div class="photo">{{thumbnail}}</div>
    <div class="scrim"></div>

    <div class="content">
      <div class="stack">
        <h1>{{headline}}</h1>
        <div class="meta">
          <span class="origin">
            <span class="source">{{sourceName}}</span>
            <span class="date">· {{date}}</span>
          </span>
          <span class="page">{{index}} / {{total}}</span>
        </div>
      </div>
    </div>
  </body>
</html>
