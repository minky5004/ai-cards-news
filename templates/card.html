<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /*
        폰트는 base64 로 심어 넣는다. Actions 러너에 한글 폰트가 없고, file:// 참조는
        헤드리스 브라우저의 로컬 파일 정책에 걸린다. 심어 두면 네트워크도 정책도 타지 않는다.
      */
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 400;
        src: url({{fontRegular}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 700;
        src: url({{fontBold}}) format("woff2");
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 900;
        src: url({{fontBlack}}) format("woff2");
      }

      :root {
        /* 캐너리 옐로에서 채도만 내린 값. 사이트 배경 #f4f1e8 위에 놓여도 종이 두 장으로 구분된다. */
        --note: #f7e267;
        /* 접착면. 실물 포스트잇은 이 부분이 미세하게 진하다. */
        --glue: #f2da55;
        /* 순검정이 아니라 갈색기가 도는 잉크. 노란 종이 위에서 검정은 너무 차갑다. */
        --ink: #2a2621;
        --ink-soft: #7a6f57;
        --body-ink: #4a4235;
        /*
          강조는 빨간 사인펜이다. 노란 종이 위에 형광펜을 칠할 수는 없고(같은 색 계열이라
          아무것도 안 보인다), 포스트잇에 실제로 긋는 필기구가 이것이다.
        */
        --mark: #d9402f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1350px;
        position: relative;
        overflow: hidden;
        background: var(--note);
        color: var(--ink);
        font-family: "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 접착 띠. 아래 경계의 옅은 그림자가 그 아래 종이를 떠 보이게 한다. */
      .glue {
        position: absolute;
        inset: 0 0 auto;
        height: 168px;
        background: linear-gradient(
          to bottom,
          var(--glue) 0%,
          var(--glue) 86%,
          rgba(0, 0, 0, 0.05) 100%
        );
      }

      /*
        종이 섬유. 균일한 색면은 종이로 읽히지 않는다 — 노랑 하나만 깔면 종이가 아니라
        노란 배경이 된다. 외부 이미지를 쓰지 않고 SVG 노이즈를 인라인으로 넣는다.
      */
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.16'/></svg>");
      }

      /*
        패딩 위아래에 뱃지와 메타의 자리가 들어 있다. 둘 다 흐름에서 빠져 고정돼 있으므로
        여기 남는 공간이 곧 글이 놓일 수 있는 높이다 — 넘침을 이 한 값으로 잴 수 있다.
      */
      .sheet {
        position: absolute;
        inset: 0;
        padding: 164px 72px 138px;
      }

      /*
        뱃지와 메타는 카드마다 같은 자리에 있어야 한다. 글줄 수를 따라 움직이면 다섯 장이
        한 묶음으로 안 읽힌다.
      */
      header {
        position: absolute;
        top: 56px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
      }

      /*
        글은 위에서부터 쌓는다. 메모를 쓰는 방향이기도 하고, 넘침을 잴 수 있는 유일한
        방향이기도 하다 — 아래 정렬이면 넘친 부분이 위로 벗어나 scrollHeight 에 안 잡힌다.
      */
      .stack {
        display: flex;
        flex-direction: column;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }

      .badge::before {
        content: "";
        width: 15px;
        height: 15px;
        background: var(--mark);
        border-radius: 50%;
      }

      .page {
        font-size: 26px;
        font-weight: 700;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      /*
        스크랩. 원문 대표 이미지는 우리가 고를 수 없다 — 매체 로고인 날도, 밈인 날도,
        영문 스크린샷인 날도 있다. 카드 전면에 깔면 그것이 카드의 주인공이 되어 버리므로
        붙인 자료의 지위로 내린다. 그러면 무엇이 와도 흉하지 않다 — 원래 그런 것을 붙인
        것이 되기 때문이다. 크롭도 얕아져 남의 글자가 확대되지 않는다.
      */
      .scrap {
        flex: none;
        align-self: center;
        position: relative;
        width: 796px;
        height: 432px;
        margin-bottom: 60px;
        background: #fdfcf7;
        padding: 16px 16px 18px;
        box-shadow:
          0 2px 3px rgba(60, 44, 10, 0.16),
          0 18px 34px rgba(60, 44, 10, 0.2);
        transform: rotate(var(--tilt));
      }

      .scrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 테이프. 이 한 조각이 이미지를 "붙인 것" 으로 확정한다. */
      .tape {
        position: absolute;
        top: -26px;
        left: var(--tape-x);
        width: 190px;
        height: 52px;
        background: rgba(255, 255, 255, 0.42);
        border-left: 1px solid rgba(255, 255, 255, 0.5);
        border-right: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 2px 4px rgba(60, 44, 10, 0.12);
        transform: rotate(var(--tape-tilt));
      }

      h1 {
        font-size: 84px;
        font-weight: 900;
        line-height: 1.19;
        letter-spacing: -0.035em;
        /* 줄바꿈이 조사에서 끊기면 읽는 리듬이 무너진다. */
        word-break: keep-all;
        text-wrap: balance;
      }

      /*
        강조는 글자색만 바꾼다. 반투명 획을 뒤에 까는 형광펜식은 노란 종이 위에서 아예
        보이지 않고, 배경을 채운 사각형은 줄 사이를 벌려 헤드라인 덩어리를 깬다.
      */
      mark {
        background: none;
        color: var(--mark);
      }

      /*
        요약 본문. 이 필드는 카드에 들어간 적이 없었다 — 웹 확대 뷰에만 있었고, 그래서
        카드만 보면 헤드라인 한 줄이 전부라 "카드뉴스" 가 아니라 "제목 이미지" 였다.
      */
      .summary {
        margin-top: 34px;
        font-size: 37px;
        font-weight: 400;
        line-height: 1.56;
        color: var(--body-ink);
        word-break: keep-all;
      }

      /*
        메타는 바닥에 고정한다. 글줄 수와 무관하게 자리가 같아야 다섯 장이 한 묶음으로
        읽힌다. 흐름에서 빼 두면 넘침 계산의 고정비로도 다룰 수 있다.
      */
      footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 64px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 28px;
        font-size: 26px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      /*
        출처명은 길이를 예측할 수 없다 — "AGN" 인 날도 있고 "Stanford Institute for
        Economic Policy Research (SIEPR)" 인 날도 있다. 줄어드는 것은 출처명 하나뿐이고
        날짜는 통째로 남는다.
      */
      .source {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .date {
        flex: none;
        font-variant-numeric: tabular-nums;
      }

      /*
        대표 이미지가 없거나 받지 못한 날. 스크랩만 빼면 그 432px 가 아래에 빈칸으로 남는다 —
        예전 골격의 "위쪽 3분의 2가 빈다" 가 아래로 옮겨갈 뿐이다. 남는 자리를 글이 나눠
        갖도록 세로 가운데에 놓고, 붙일 것이 없는 만큼 글씨를 키운다.

        넘침 계산은 이 정렬에 영향받지 않는다 — 재는 대상이 {@code .stack} 자신의 콘텐츠
        높이라 요소가 어디에 놓이든 같은 값이다.
      */
      .bare .sheet {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .bare .scrap {
        display: none;
      }

      .bare h1 {
        font-size: 104px;
      }

      .bare .summary {
        margin-top: 40px;
        font-size: 40px;
      }
    </style>
  </head>
  <body
    class="{{variant}}"
    style="--tilt: {{tilt}}; --tape-x: {{tapeX}}; --tape-tilt: {{tapeTilt}}"
  >
    <div class="glue"></div>
    <div class="grain"></div>

    <div class="sheet">
      <header>
        <span class="badge">AI NEWS</span>
        <span class="page">{{index}} / {{total}}</span>
      </header>

      <div class="stack">
        <figure class="scrap">
          <div class="tape"></div>
          {{thumbnail}}
        </figure>

        <h1>{{headline}}</h1>
        <p class="summary">{{body}}</p>
      </div>

      <footer>
        <span class="source">{{sourceName}}</span>
        <span class="date">{{date}}</span>
      </footer>
    </div>
  </body>
</html>
