# 웹 사이트를 GitHub Pages 에 배포한다.
#
# 배포 소스는 `main` 이다. main 이 기본 브랜치이고, 파이프라인이 매일 커밋할
# `content/` 도 이리로 온다.
#
# 개발 기간에는 dev 였다. 나눌 것이 있는 동안에는 dev 가 배포 소스여야 매일
# dev → main 머지라는 수동 지점이 안 생겼다. 개발이 끝나 그 분기가 사라지자
# 근거가 뒤집힌다 — 봇이 dev 에만 커밋하면 main 이 매일 하루씩 뒤로 밀려,
# 기본으로 보이는 브랜치가 멈춘 리포라고 말하게 된다.
#
# 파이프라인(Java)만 바뀐 커밋으로는 돌지 않는다 — 사이트 산출물이 그대로다.
name: 웹 배포

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "content/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "빌드할 커밋 또는 브랜치. 비우면 이 실행을 만든 커밋"
        required: false
        type: string

  # 파이프라인이 발행 커밋을 올린 뒤 직접 부른다. 위의 push 트리거로는 안 닿는다 —
  # GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로를 발화시키지 않는다(재귀 방지).
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 중간에 끊지 않는다. 취소된 배포는 사이트를 반쯤 갱신된 상태로 남길 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 못박음이 필요한 것은 파이프라인이 부르는 갈래 하나뿐이다. 그때의 트리거 SHA 는
      # 파이프라인이 시작된 시점이라 방금 올린 발행 커밋보다 앞선다 — 배포는 돌고도
      # 오늘 카드가 빠진 사이트가 나간다. 그래서 호출부가 푸시한 SHA 를 직접 넘긴다.
      #
      # 빈 값은 checkout 의 기본값(이 실행을 만든 커밋)으로 떨어진다. push 와
      # workflow_dispatch 는 그 기본값이 맞다 — 브랜치 헤드로 못박으면 옛 배포를
      # 재실행했을 때 당시 상태가 아니라 현재 main 이 빌드된다.
      #
      # 재사용 워크플로 안의 github.event_name 은 호출한 쪽의 이벤트(schedule)라
      # 트리거로 갈래를 가를 수 없다. 갈래를 가르는 것은 입력이 채워졌는지 여부다.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # 버전은 packageManager 필드에서 읽는다. 리포 루트에는 package.json 이
      # 없으므로(웹만 Node 프로젝트다) 경로를 명시해야 한다 — 기본값인 루트를
      # 그대로 두면 "No pnpm version is specified" 로 죽는다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 의존성 설치
        working-directory: web
        run: pnpm install --frozen-lockfile

      # prebuild 가 content/<date>/cards/ 를 public/ 로 복사한다.
      # content/ 가 아직 리포에 없으면 카드 없는 사이트가 나온다(M5 에서 채워진다).
      - name: 빌드
        working-directory: web
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
