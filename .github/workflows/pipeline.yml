# 파이프라인을 러너에서 돌린다.
#
# M5 를 한 번에 올리지 않고 쪼개 밟는 중이다. 로컬에는 있고 러너에는 없는 것이 셋
# (JDK 25 · GEMINI_API_KEY · Chromium)인데 전부 한 워크플로에 넣으면 어디서 죽었는지
# 가리기 어렵다. JDK 25 와 Gradle wrapper 는 M5-2 에서, Chromium 은 M5-4 에서 밟았고,
# 여기서 마지막 하나인 API 키를 붙인다. 이제 파이프라인 다섯 단계가 전부 러너에서 돈다.
#
# 단계를 한 잡에 몰아 넣는 이유는 단계끼리 content/<date>/ 를 파일로 주고받기 때문이다.
# 잡을 나누면 그 사이마다 artifact 업로드·다운로드가 필요해진다 — 수집부터 커밋까지가
# 한 줄로 이어지는 하나의 실행이다.
#
# 커밋 다음에 배포 워크플로를 직접 부른다. content/** push 트리거로는 안 닿는다 —
# GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로를 발화시키지 않는다(재귀 방지). 2026-07-28
# 첫 cron 은 발행까지 끝내고도 사이트가 그 전날에 머물렀고, 그 자리가 여기였다.
# 이 워크플로 자신은 push 로 돌지 않으므로 자기 커밋이 자기를 다시 부르지는 않는다.
name: 파이프라인

on:
  # 21:00 KST = 12:00 UTC. 러너가 붐비면 실제 실행은 몇 분에서 수십 분 늦는다 —
  # 정시 발행이 아니라 "그날 안에 발행" 이 목표이므로 문제되지 않는다.
  #
  # KST 자정 근처로 잡지 않는 이유가 둘 있다. 늦게 시작하면 지연이 날짜를 넘길 수 있고,
  # Gemini 무료 티어 한도는 Pacific 자정(7월 기준 16:00 KST)에 리셋되므로 21:00 은
  # 리셋 이후라 하루치 한도를 온전히 쓴다.
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "수집 날짜 (YYYY-MM-DD). 비우면 KST 기준 오늘"
        required: false
        type: string
      force:
        description: "이미 있는 산출물을 다시 만든다"
        required: false
        default: false
        type: boolean

# 산출물을 리포에 커밋하므로 쓰기가, 실패를 알리려면 이슈 쓰기가 필요하다.
permissions:
  contents: write
  issues: write

# 같은 날짜를 두 실행이 동시에 만들면 뒤엣것이 앞엣것을 덮거나 푸시가 충돌한다.
# 진행 중인 것을 취소하지 않는 이유는 카피가 이미 한도를 먹었을 수 있어서다 —
# 죽이면 그 호출은 카드가 되지 못한 채 사라진다.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 알림 잡이 이슈 제목에 쓸 날짜다. 잡이 나뉘면 steps 출력에 닿지 못한다.
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      # 날짜를 여기서 한 번 확정한다. 각 단계가 따로 계산하면 자정을 넘기는 순간
      # 단계마다 다른 날짜를 쓰게 된다 — 21:00 KST 정시 실행에서는 안 겪지만
      # 늦은 재시도에서는 실제로 갈린다.
      - name: 날짜 확정
        id: date
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "발행 날짜 $DATE (KST)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # wrapper 가 리포에 있으므로 Gradle 을 설치하지는 않는다. 배포판과 의존성 캐시만 받는다.
      - uses: gradle/actions/setup-gradle@v4

      # Chromium 은 170MB 라 매일 받으면 그대로 낭비다.
      #
      # 경로는 Playwright 의 기본값(~/.cache/ms-playwright)을 그대로 쓴다.
      # PLAYWRIGHT_BROWSERS_PATH 로 workspace 안에 옮기면 M5-5 의 git add 에 170MB 가
      # 딸려 들어갈 수 있다.
      #
      # 키는 build.gradle.kts 의 해시로 잡는다. 브라우저 빌드는 Playwright 버전에 묶여
      # 있어서, 버전이 올라간 채 옛 캐시를 쓰면 실행 시점에 어긋난다. 다른 의존성만
      # 바뀌어도 키가 흔들리지만 그쪽으로 틀리면 한 번 더 받고 끝이다.
      - name: Chromium 캐시
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pipeline/build.gradle.kts') }}

      # run 태스크가 이미 여기에 의존하지만 단계를 따로 둔다. 설치와 렌더가 한 덩어리로
      # 묶이면 로그에서 "캐시가 먹었는가" 를 시간으로 가릴 수 없다.
      - name: Chromium 설치
        run: |
          echo "캐시 적중: ${{ steps.chromium-cache.outputs.cache-hit == 'true' && '예' || '아니오' }}"
          ./gradlew installChromium

      # 수집을 한참 하고 나서 설정 오타로 죽으면 그만큼 네트워크가 낭비된다.
      - name: 설정 검증
        run: ./gradlew run --args="config" -x installChromium

      # -x installChromium 을 빼면 안 된다. run 태스크가 Chromium 설치에 의존하는데
      # 수집에는 브라우저가 필요 없다. 위에서 이미 깔았으므로 다시 태울 이유가 없다.
      - name: 수집
        env:
          DATE_ARG: --date ${{ steps.date.outputs.date }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: ./gradlew run --args="ingest $DATE_ARG $FORCE_ARG" -x installChromium

      # 본문 추출은 남의 서버를 긁는 단계라 키가 필요 없다. copy 앞에 두는 이유는
      # 순서 때문만이 아니다 — 여기서 실패하면 그 기사는 카피 대상에서 빠지므로,
      # 추출이 먼저 끝나야 Gemini 호출 수가 확정된다.
      - name: 본문 추출
        env:
          DATE_ARG: --date ${{ steps.date.outputs.date }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: ./gradlew run --args="extract $DATE_ARG $FORCE_ARG" -x installChromium

      # 키는 이 단계에만 준다. 워크플로 전역 env 에 두면 수집·렌더처럼 키가 필요 없는
      # 단계까지 값을 들고 있게 되고, 그 단계가 부르는 남의 코드에도 그대로 노출된다.
      #
      # 무료 티어 한도가 하루 20회/모델이라 여기가 파이프라인에서 가장 비싼 단계다.
      # 재실행을 반복하면 그날 카드를 못 만든다 — usage.json 에 누적 호출이 쌓이고
      # 단계 시작에 "오늘 이미 N회" 가 찍히므로 로그에서 확인할 수 있다.
      - name: 카피라이팅
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATE_ARG: --date ${{ steps.date.outputs.date }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: ./gradlew run --args="copy $DATE_ARG $FORCE_ARG" -x installChromium

      # 여기는 -x 를 붙이지 않는다. 렌더가 실제로 Chromium 을 쓰는 단계다.
      - name: 카드 렌더링
        env:
          DATE_ARG: --date ${{ steps.date.outputs.date }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: ./gradlew run --args="render $DATE_ARG $FORCE_ARG"

      # 커밋보다 먼저 올린다. 커밋이나 푸시가 죽어도 그날 만든 것은 남아야 진단할 수 있다.
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
          if-no-files-found: error

      # 여기까지 왔다는 것이 곧 완성 판정이다. 앞 단계들이 부분 실패에서 종료 1 로 죽으므로
      # (카피는 절반 규칙, 렌더는 한 장이라도 실패하면) 미완성인 날짜는 이 단계에 닿지 못한다.
      # 셸에서 장수를 다시 세지 않는 이유가 그것이다 — 판정이 두 곳에 있으면 어긋난다.
      #
      # 푸시 대상은 github.ref_name 이다. cron 은 dev 에서 돌고, 작업 브랜치로 검증할 때는
      # 그 브랜치에 쌓인다. dev 로 못박으면 검증 실행이 발행 브랜치를 건드린다.
      - name: 산출물 커밋
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "content/$DATE"

          # 재시도로 같은 결과가 다시 나온 경우다. 빈 커밋을 쌓지 않는다.
          if git diff --cached --quiet; then
            echo "content/$DATE 에 바뀐 것이 없다 — 커밋하지 않는다"
            exit 0
          fi

          git commit -m "chore: $DATE 카드 발행"

          # 러너가 도는 2~3분 사이에 사람이 올린 커밋이 있을 수 있다. 산출물은 날짜별
          # 새 디렉터리라 내용이 겹치지 않으므로 rebase 로 얹으면 된다.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  # 발행 커밋을 사이트에 올린다. 파이프라인이 죽으면 needs 가 막아 돌지 않는다 —
  # 미완성인 날짜가 사이트에 나가지 않는다.
  #
  # dev 에서만 돈다. 배포 소스가 dev 라는 것을 여기서 강제하지 않으면, 그 규칙은
  # github-pages 환경의 브랜치 허용 목록에만 존재한다 — 리포 설정 한 곳이 풀리면
  # 작업 브랜치 검증 실행이 실사이트를 덮어쓴다. 게다가 그 거부는 사이트를 빌드하고
  # 나서야 나오므로, 검증할 때마다 2~3분을 태우고 실행이 통째로 빨개진다.
  #
  # permissions 를 잡에 다시 적는 이유는 잡 레벨이 워크플로 레벨을 덮어쓰기 때문이다.
  # 위쪽 contents: write · issues: write 는 커밋과 실패 이슈용이라 Pages 권한이 없다.
  deploy:
    needs: pipeline
    if: github.ref_name == 'dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # 무인 실행이라 아무도 안 보고 있다. 죽은 것을 알리지 않으면 며칠 뒤 사이트가
  # 멈춰 있는 걸 보고서야 안다.
  #
  # 잡으로 빼낸 이유는 배포까지 지켜보기 위해서다. 스텝으로 두면 자기 잡이 도는 동안만
  # 발화해 deploy 잡의 실패는 그대로 통과한다 — 카드는 커밋됐는데 사이트만 어제에
  # 머무는 상태가 무성으로 지나가는 자리가 거기였다.
  #
  # if: failure() 는 needs 중 하나라도 실패했을 때 참이다. pipeline 이 죽어 deploy 가
  # 건너뛰어진 경우에도 발화한다.
  alert:
    needs: [pipeline, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # 같은 제목의 열린 이슈가 있으면 새로 만들지 않는다 — 재시도마다 이슈가 쌓이면
      # 알림이 소음이 되어 오히려 안 보게 된다. 제목에 단계를 넣는 것은 고치는 방법이
      # 달라서다. 파이프라인은 죽은 단계부터 이어 돌리면 되고, 배포는 다시 부르면 된다.
      - name: 실패 이슈
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DATE: ${{ needs.pipeline.outputs.date }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 날짜 확정 단계에 닿기 전에 죽으면 출력이 비어 있다. 그대로 두면 제목이
          # "실패 — " 로 끝나 날짜별 중복 억제가 통째로 어긋난다.
          [ -n "$DATE" ] || DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)

          if [ "$PIPELINE_RESULT" = "success" ]; then
            STAGE="배포"
            HOWTO="Actions → 파이프라인 → Run workflow. 날짜를 \`$DATE\` 로 준다.
          산출물이 이미 리포에 있으면 다섯 단계는 전부 건너뛰고 배포만 다시 돈다 —
          Gemini 는 한 번도 부르지 않는다."
          else
            STAGE="파이프라인"
            HOWTO="Actions → 파이프라인 → Run workflow. 날짜를 \`$DATE\` 로 준다.

          이미 끝난 단계는 산출물이 있어 건너뛰므로, 죽은 단계부터 이어서 돈다.
          같은 결과를 다시 만들어야 할 때만 \`force\` 를 켠다 — 카피를 다시 돌리면
          Gemini 하루 한도(20회)를 그만큼 더 쓴다."
          fi

          TITLE="$STAGE 실패 — $DATE"

          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number')" ]; then
            echo "$TITLE 이슈가 이미 열려 있다 — 새로 만들지 않는다"
            exit 0
          fi

          gh issue create --title "$TITLE" --label bug --body "$DATE 발행의 $STAGE 단계가 실패했다.

          - 실행 로그: $RUN_URL
          - 트리거: \`${{ github.event_name }}\`

          ## 다시 돌리려면

          $HOWTO"
